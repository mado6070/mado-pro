<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tapio | بوابة الخدمات الذكية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #05050a;
            --card-surface: rgba(18, 20, 32, 0.7);
            --border-glow: rgba(56, 189, 248, 0.2);
            --text-main: #ffffff;
            --text-secondary: #94a3b8;
            --primary-accent: #38bdf8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(56, 189, 248, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(99, 102, 241, 0.08) 0%, transparent 40%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }

        .profile-card {
            width: 100%;
            max-width: 420px;
            background: var(--card-surface);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--border-glow);
            border-radius: 32px;
            padding: 36px 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .profile-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 150px;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--primary-accent), transparent);
        }

        .avatar-wrapper {
            position: relative;
            width: 105px;
            height: 105px;
            margin: 0 auto 20px auto;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--primary-accent);
            box-shadow: 0 0 30px rgba(56, 189, 248, 0.3);
            background: #0f172a;
        }

        .business-title {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
            color: #f8fafc;
        }

        .business-subtitle {
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 400;
            margin-bottom: 28px;
        }

        .action-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 16px 20px;
            margin: 12px 0;
            border-radius: 18px;
            text-decoration: none;
            font-weight: 700;
            font-size: 15px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(255, 255, 255, 0.05);
            cursor: pointer;
        }

        .action-btn:hover {
            transform: translateY(-3px);
            filter: brightness(1.1);
        }

        .action-btn span:first-child {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-google {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: #000;
            box-shadow: 0 10px 25px rgba(245, 158, 11, 0.2);
        }

        .btn-instapay {
            background: linear-gradient(135deg, #6366f1 0%, #4338ca 100%);
            color: #fff;
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.25);
        }

        /* قسيمة المحافظ الاحترافية */
        .wallets-wrapper {
            margin: 12px 0;
        }

        .wallets-toggle-btn {
            background: linear-gradient(135deg, #f43f5e 0%, #be123c 100%);
            color: #fff;
            width: 100%;
            padding: 16px 20px;
            border-radius: 18px;
            font-weight: 700;
            font-size: 15px;
            border: none;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 10px 25px rgba(244, 63, 94, 0.25);
            transition: all 0.3s ease;
        }

        .wallets-toggle-btn:hover {
            transform: translateY(-3px);
            filter: brightness(1.1);
        }

        .wallets-dropdown {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            background: rgba(15, 23, 42, 0.5);
            border-radius: 18px;
            margin-top: 8px;
            padding: 0 12px;
        }

        .wallets-dropdown.open {
            max-height: 300px;
            padding: 14px 12px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .wallet-card-item {
            background: rgba(255, 255, 255, 0.03);
            padding: 14px;
            border-radius: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .wallet-details {
            text-align: right;
        }

        .wallet-type {
            font-size: 13px;
            color: var(--primary-accent);
            font-weight: 700;
            margin-bottom: 2px;
        }

        .wallet-number {
            font-size: 15px;
            font-family: monospace;
            color: #fff;
            letter-spacing: 0.5px;
        }

        .wallet-holder {
            font-size: 11px;
            color: var(--text-secondary);
        }

        .copy-trigger {
            background: var(--primary-accent);
            color: #05050a;
            border: none;
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.2s;
        }

        .copy-trigger:active {
            transform: scale(0.92);
        }

        /* شبكة السوشيال ميديا بتصميم عصري */
        .social-matrix {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin: 16px 0;
        }

        .social-link {
            padding: 13px;
            border-radius: 14px;
            text-decoration: none;
            font-weight: 700;
            font-size: 13.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: 0.25s;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .social-link:hover {
            transform: translateY(-2px);
        }

        .s-fb { background: rgba(24, 119, 242, 0.1); color: #60a5fa; }
        .s-ig { background: rgba(220, 39, 67, 0.1); color: #f472b6; }
        .s-tk { background: rgba(255, 255, 255, 0.05); color: #fff; }
        .s-wa { background: rgba(37, 211, 102, 0.1); color: #4ade80; }

        /* بانر التسويق الذاتي الفخم */
        .self-promo-banner {
            margin-top: 22px;
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.08) 0%, rgba(99, 102, 241, 0.12) 100%);
            border: 1px dashed rgba(56, 189, 248, 0.4);
            padding: 18px;
            border-radius: 20px;
            text-align: center;
        }

        .promo-desc {
            font-size: 13px;
            color: #cbd5e1;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .promo-action-btn {
            display: block;
            background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
            color: #05050a;
            text-decoration: none;
            padding: 14px;
            border-radius: 14px;
            font-weight: 800;
            font-size: 15px;
            box-shadow: 0 10px 25px rgba(56, 189, 248, 0.3);
            transition: all 0.3s ease;
        }

        .promo-action-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(56, 189, 248, 0.45);
        }

        .brand-footer {
            margin-top: 24px;
            font-size: 12px;
            color: var(--text-secondary);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 16px;
            letter-spacing: 0.3px;
        }

        .brand-footer span {
            color: var(--primary-accent);
            font-weight: 800;
        }
    </style>
</head>
<body>

    <div class="profile-card">
        <!-- شعار المحل -->
        <div class="avatar-wrapper">
            <img src="https://images.unsplash.com/photo-1541167760496-1628856ab772?w=150" alt="Logo" class="avatar">
        </div>
        
        <h1 class="business-title">قهوتنا</h1>
        <p class="business-subtitle">أهلاً بك! نسعد دائماً بخدمتك وتقييمك لنا</p>

        <!-- زرار تقييم جوجل -->
        <a href="https://search.google.com/local/writereview?placeid=ChIJfdYbWADf9RQR_HyAz1upcCo" class="action-btn btn-google" target="_blank">
            <span>⭐ قيّمنا بـ 5 نجوم على جوجل</span>
            <span>‹</span>
        </a>

        <!-- زرار إنستاباي -->
        <a href="https://ipn.eg/" class="action-btn btn-instapay" target="_blank">
            <span>💳 الدفع الفوري عبر InstaPay</span>
            <span>‹</span>
        </a>

        <!-- قائمة المحافظ المنسدلة -->
        <div class="wallets-wrapper">
            <button class="wallets-toggle-btn" onclick="toggleWalletDrawer()">
                <span>📱 المحافظ الإلكترونية</span>
                <span id="drawerArrow">▼</span>
            </button>
            <div id="walletDrawer" class="wallets-dropdown">
                <div class="wallet-card-item">
                    <div class="wallet-details">
                        <div class="wallet-type">فودافون كاش</div>
                        <div class="wallet-number">01208884686</div>
                        <div class="wallet-holder">باسم: mohamed m** a** a</div>
                    </div>
                    <button class="copy-trigger" onclick="copyData('01208884686')">نسخ</button>
                </div>
            </div>
        </div>

        <!-- أزرار السوشيال ميديا -->
        <div class="social-matrix">
            <a href="#" class="social-link s-fb" target="_blank">فيسبوك</a>
            <a href="#" class="social-link s-ig" target="_blank">انستجرام</a>
            <a href="#" class="social-link s-tk" target="_blank">تيك توك</a>
            <a href="#" class="social-link s-wa" target="_blank">واتساب</a>
        </div>

        <!-- قسم التسويق الذاتي -->
        <div class="self-promo-banner">
            <div class="promo-desc">عجبك الستاند الذكي وحابب تعمل واحد لمشروعك؟ 🚀</div>
            <a href="https://wa.me/201208884686?text=مرحباً%20ماضو،%20أعجبني%20نظام%20Tapio%20وأريد%20عمل%20ستاند%20ذكي%20لمشروعي" class="promo-action-btn" target="_blank">
                ✨ احصل على ستاند ذكي لمشروعك الآن
            </a>
        </div>

        <div class="brand-footer">
            Powered by <span>Tapio</span> 🚀
        </div>
    </div>

    <script>
        function toggleWalletDrawer() {
            const drawer = document.getElementById("walletDrawer");
            const arrow = document.getElementById("drawerArrow");
            drawer.classList.toggle("open");
            arrow.style.transform = drawer.classList.contains("open") ? "rotate(180deg)" : "rotate(0deg)";
        }

        function copyData(text) {
            navigator.clipboard.writeText(text);
            alert("تم نسخ الرقم بنجاح! 📋");
        }
    </script>

</body>
</html>
