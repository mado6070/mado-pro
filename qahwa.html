<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tapio | البوابة الذكية</title>
    <style>
        :root {
            --bg-main: #0f172a;
            --card-glass: rgba(255, 255, 255, 0.03);
            --border-glass: rgba(255, 255, 255, 0.08);
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-main);
            background-image: 
                radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(99, 102, 241, 0.12) 0px, transparent 50%);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            width: 100%;
            max-width: 400px;
            background: var(--card-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-glass);
            padding: 30px 20px;
            border-radius: 30px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .logo-box {
            width: 90px;
            height: 90px;
            margin: 0 auto 15px auto;
            border-radius: 50%;
            padding: 3px;
            background: linear-gradient(135deg, #38bdf8, #6366f1);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            background: #0f172a;
        }

        h1 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        p {
            color: var(--text-muted);
            font-size: 13px;
            margin-bottom: 22px;
        }

        .link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            border-radius: 16px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14.5px;
            transition: 0.2s ease;
            box-sizing: border-box;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .link-btn:hover {
            transform: scale(1.02);
        }

        .btn-google {
            background: rgba(251, 191, 36, 0.1);
            color: #fbbf24;
            border-color: rgba(251, 191, 36, 0.2);
        }

        .btn-instapay {
            background: rgba(99, 102, 241, 0.1);
            color: #818cf8;
            border-color: rgba(99, 102, 241, 0.2);
        }

        /* ستايل المحافظ المنسدلة الجديدة */
        .wallet-container {
            margin: 10px 0;
        }

        .wallet-toggle {
            background: rgba(244, 63, 94, 0.1);
            color: #fb7185;
            border: 1px solid rgba(244, 63, 94, 0.2);
            width: 100%;
            padding: 14px;
            border-radius: 16px;
            font-weight: 600;
            font-size: 14.5px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
            transition: 0.2s;
        }

        .wallet-dropdown {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
            background: rgba(15, 23, 42, 0.4);
            border-radius: 14px;
            margin-top: 5px;
            padding: 0 10px;
        }

        .wallet-dropdown.active {
            max-height: 250px;
            padding: 10px;
            border: 1px solid var(--border-glass);
        }

        .wallet-row {
            background: rgba(255, 255, 255, 0.02);
            padding: 10px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .wallet-details {
            text-align: right;
        }

        .w-title {
            font-size: 12px;
            color: #38bdf8;
            font-weight: bold;
        }

        .w-digits {
            font-size: 14px;
            font-family: monospace;
            color: #fff;
        }

        .w-owner {
            font-size: 10px;
            color: var(--text-muted);
        }

        .copy-action {
            background: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
        }

        /* شبكة السوشيال ميديا */
        .social-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin: 12px 0;
        }

        .social-chip {
            padding: 10px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            border: 1px solid rgba(255,255,255,0.05);
            transition: 0.2s;
        }

        .s-fb { background: rgba(24, 119, 242, 0.1); color: #60a5fa; }
        .s-ig { background: rgba(220, 39, 67, 0.1); color: #f472b6; }
        .s-tk { background: rgba(255, 255, 255, 0.05); color: #fff; }
        .s-wa { background: rgba(37, 211, 102, 0.1); color: #4ade80; }

        /* بوكس التسويق الذاتي */
        .promo-card {
            margin-top: 15px;
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.05), rgba(99, 102, 241, 0.08));
            border: 1px dashed rgba(56, 189, 248, 0.3);
            padding: 14px;
            border-radius: 16px;
            text-align: center;
        }

        .promo-msg {
            font-size: 12px;
            color: #cbd5e1;
            margin-bottom: 10px;
        }

        .promo-cta {
            display: block;
            background: #38bdf8;
            color: #0f172a;
            text-decoration: none;
            padding: 11px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 13.5px;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.2);
        }

        .footer {
            margin-top: 18px;
            font-size: 11px;
            color: var(--text-muted);
            border-top: 1px solid var(--border-glass);
            padding-top: 12px;
        }

        .footer span {
            color: #38bdf8;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="logo-box">
            <img src="https://images.unsplash.com/photo-1541167760496-1628856ab772?w=150" alt="Logo" class="logo">
        </div>
        
        <h1>اسم المحل هنا</h1>
        <p>أهلاً بك! نسعد دائماً بخدمتك وتقييمك لنا</p>

        <!-- تقييم جوجل -->
        <a href="رابط_جوجل" class="link-btn btn-google" target="_blank">
            ⭐ قيّمنا بـ 5 نجوم على جوجل
        </a>

        <!-- إنستاباي -->
        <a href="https://ipn.eg/" class="link-btn btn-instapay" target="_blank">
            💳 الدفع الفوري عبر InstaPay
        </a>

        <!-- المحافظ -->
        <div class="wallet-container">
            <button class="wallet-toggle" onclick="toggleWallets()">
                <span>📱 المحافظ الإلكترونية</span>
                <span>▾</span>
            </button>
            <div id="walletList" class="wallet-dropdown">
                <div class="wallet-row">
                    <div class="wallet-details">
                        <div class="w-title">فودافون كاش</div>
                        <div class="w-digits">01208884686</div>
                        <div class="w-owner">باسم: mohamed m** a** a</div>
                    </div>
                    <button class="copy-action" onclick="copyNum('01208884686')">نسخ</button>
                </div>
            </div>
        </div>

        <!-- السوشيال ميديا -->
        <div class="social-grid">
            <a href="رابط_فيس" class="social-chip s-fb" target="_blank">فيسبوك</a>
            <a href="رابط_انستا" class="social-chip s-ig" target="_blank">انستجرام</a>
            <a href="رابط_تيكتوك" class="social-chip s-tk" target="_blank">تيك توك</a>
            <a href="رابط_واتساب" class="social-chip s-wa" target="_blank">واتساب</a>
        </div>

        <!-- التسويق الذاتي -->
        <div class="promo-card">
            <div class="promo-msg">عجبك الستاند الذكي وحابب تعمل واحد لمشروعك؟ 🚀</div>
            <a href="https://wa.me/201208884686?text=مرحباً%20ماضو،%20أعجبني%20نظام%20Tapio%20وأريد%20عمل%20ستاند%20ذكي%20لمشروعي" class="promo-cta" target="_blank">
                ✨ احصل على ستاند ذكي لمشروعك الآن
            </a>
        </div>

        <div class="footer">
            Powered by <span>Tapio</span> 🚀
        </div>
    </div>

    <script>
        function toggleWallets() {
            document.getElementById("walletList").classList.toggle("active");
        }
        function copyNum(txt) {
            navigator.clipboard.writeText(txt);
            alert("تم نسخ الرقم بنجاح! 📋");
        }
    </script>

</body>
</html>
