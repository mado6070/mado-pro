<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة الدفع والتقييم - قهوتنا</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: #1e293b;
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            text-align: center;
            border: 1px solid #334155;
        }
        .logo {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 15px;
            border: 3px solid #38bdf8;
            background: #334155;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 5px;
            color: #f8fafc;
        }
        p {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            margin: 12px 0;
            border-radius: 12px;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            transition: 0.2s;
            box-sizing: border-box;
            cursor: pointer;
            border: none;
            text-align: center;
        }
        .btn-google {
            background-color: #f59e0b;
            color: #000;
        }
        .btn-instapay {
            background-color: #6366f1;
            color: #fff;
        }
        .dropdown {
            margin: 12px 0;
            width: 100%;
        }
        .drop-btn {
            background-color: #e11d48;
            color: #fff;
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 16px;
            border: none;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
        }
        .drop-content {
            display: none;
            background-color: #334155;
            border-radius: 12px;
            margin-top: 8px;
            padding: 12px;
            border: 1px solid #475569;
            text-align: right;
        }
        .drop-content.show {
            display: block;
        }
        .wallet-item {
            background: #0f172a;
            padding: 10px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .wallet-info .w-name {
            font-size: 13px;
            color: #38bdf8;
            font-weight: bold;
        }
        .wallet-info .w-num {
            font-size: 15px;
            color: #fff;
            letter-spacing: 0.5px;
        }
        .copy-btn {
            background-color: #e11d48;
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            font-weight: bold;
        }
        .footer {
            margin-top: 20px;
            font-size: 11px;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="https://images.unsplash.com/photo-1511920170033-f8396924c348?w=150" alt="Logo" class="logo">
        
        <h1>قهوتنا</h1>
        <p>أهلاً بك! نسعد بتعليقك ودعمك لنا:</p>

        <!-- زرار تقييم جوجل -->
        <a href="https://search.google.com/local/writereview?placeid=ChIJfdYbWADf9RQR_HyAz1upcCo" class="btn btn-google" target="_blank">
            ⭐ قيّمنا بـ 5 نجوم على جوجل
        </a>

        <!-- زرار إنستاباي -->
        <a href="https://ipn.eg/" class="btn btn-instapay" target="_blank">
            💳 الدفع الفوري عبر InstaPay
        </a>

        <!-- قائمة المحافظ -->
        <div class="dropdown">
            <button class="drop-btn" onclick="toggleDropdown()">
                <span>📱 الدفع عبر المحفظة الإلكترونية</span>
                <span>▼</span>
            </button>
            <div id="walletDropdown" class="drop-content">
                <div class="wallet-item">
                    <div class="wallet-info">
                        <div class="w-name">فودافون كاش</div>
                        <div class="w-num">01000000000</div>
                    </div>
                    <button class="copy-btn" onclick="copyText('01000000000')">نسخ</button>
                </div>
            </div>
        </div>

        <div class="footer">
            Powered by ReviewPro Solutions 🚀
        </div>
    </div>

    <script>
        function toggleDropdown() {
            document.getElementById("walletDropdown").classList.toggle("show");
        }
        function copyText(text) {
            navigator.clipboard.writeText(text);
            alert("تم نسخ الرقم بنجاح! 📋");
        }
    </script>
</body>
</html>
