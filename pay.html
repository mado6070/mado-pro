<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الدفع - Tapio</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            text-align: center;
            padding: 50px;
        }
        .payment-card {
            background: #ffffff;
            max-width: 400px;
            margin: 0 auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        .payment-card h2 {
            color: #333;
            margin-bottom: 20px;
        }
        .payment-card p {
            color: #666;
            margin-bottom: 30px;
        }
        .btn-pay {
            display: inline-block;
            background-color: #28a745;
            color: white;
            padding: 12px 25px;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: background 0.3s;
        }
        .btn-pay:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

    <div class="payment-card">
        <h2>إتمام عملية الدفع</h2>
        <p>اضغط على الزر أدناه للانتقال إلى صفحة الدفع وإتمام طلبك بكل سهولة.</p>
        
        <!-- رابط الكارت أو زر الدفع المباشر -->
        <a href="https://mado6070.github.io/tapio/" class="btn-pay">ادفع الآن</a>
    </div>

</body>
</html>
