<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PÀO | البوابة الذكية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --pao-bg: #0c1210; /* أخضر غامق ملكي مستوحى من هويبتهم */
            --pao-card: rgba(22, 32, 28, 0.75);
            --pao-border: rgba(92, 140, 115, 0.2);
            --pao-accent: #79b793; /* أخضر هادئ ورايق */
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--pao-bg);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(121, 183, 147, 0.1) 0%, transparent 60%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }

        .card {
            width: 100%;
            max-width: 410px;
            background: var(--pao-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--pao-border);
            border-radius: 32px;
            padding: 35px 22px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
            text-align: center;
        }

        .logo-box {
            width: 95px;
            height: 95px;
            margin: 0 auto 16px auto;
            border-radius: 50%;
            padding: 3px;
            background: linear-gradient(135deg, #79b793, #3b5a49);
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 25px rgba(121, 183, 147, 0.25);
        }

        .logo {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            background: #0c1210;
        }

        h1 {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 1px;
            margin-bottom: 4px;
            color: #fff;
        }

        p {
            color: var(--text-muted);
            font-size: 13.5px;
            margin-bottom: 24px;
        }

        .link-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 15px 18px;
            margin: 12px 0;
            border-radius: 16px;
            text-decoration: none;
            font-weight: 700;
            font-size: 15px;
            transition: 0.25s ease;
            border: 1px solid rgba(255, 255, 255, 0.04);
            cursor: pointer;
        }

        .link-btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.08);
        }

        .btn-google {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: #000;
            box-shadow: 0 8px 20px rgba(245, 158, 11, 0.2);
        }

        .btn-instapay {
            background: linear-gradient(135deg, #6366f1 0%, #4338ca 100%);
            color: #fff;
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.2);
        }

        /* ستايل المحافظ */
        .wallet-container {
            margin: 12px 0;
        }

        .wallet-toggle {
            background: linear-gradient(135deg, #f43f5e 0%, #be123c 100%);
            color: #fff;
            width: 100%;
            padding: 15px 18px;
            border-radius: 16px;
            font-weight: 700;
            font-size: 15px;
            border: none;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 8px 20px rgba(244, 63, 94, 0.2);
            transition: 0.25s;
        }

        .wallet-toggle:hover {
            transform: translateY(-2px);
            filter: brightness(1.08);
        }

        .wallet-dropdown {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.35s ease;
            background: rgba(12, 18, 16, 0.6);
            border-radius: 16px;
            margin-top: 6px;
            padding: 0 10px;
        }

        .wallet-dropdown.active {
            max-height: 250px;
            padding: 12px 10px;
            border: 1px solid var(--pao-border);
        }

        .wallet-row {
            background: rgba(255, 255, 255, 0.03);
            padding: 12px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .wallet-details {
            text-align: right;
        }

        .w-title {
            font-size: 12px;
            color: var(--pao-accent);
            font-weight: 800;
        }

        .w-digits {
            font-size: 14.5px;
            font-family: monospace;
            color: #fff;
            letter-spacing: 0.5px;
        }

        .w-owner {
            font-size: 10.5px;
            color: var(--text-muted);
        }

        .copy-action {
            background: var(--pao-accent);
            color: #0c1210;
            border: none;
            padding: 7px 14px;
            border-radius: 9px;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
        }

        /* شبكة السوشيال ميديا */
        .social-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin: 14px 0;
        }

        .social-chip {
            padding: 12px;
            border-radius: 14px;
            text-decoration: none;
            font-size: 13.5px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            border: 1px solid rgba(255,255,255,0.05);
            transition: 0.25s;
        }

        .social-chip:hover {
            transform: translateY(-2px);
        }

        .s-fb { background: rgba(24, 119, 242, 0.12); color: #60a5fa; }
        .s-ig { background: rgba(220, 39, 67, 0.12); color: #f472b6; }
        .s-tk { background: rgba(255, 255, 255, 0.06); color: #fff; }
        .s-wa { background: rgba(37, 211, 102, 0.12); color: #4ade80; }

        /* بوكس التسويق الذاتي لـ Tapio */
        .promo-card {
            margin-top: 18px;
            background: linear-gradient(135deg, rgba(121, 183, 147, 0.08), rgba(59, 90, 73, 0.15));
            border: 1px dashed rgba(121, 183, 147, 0.4);
            padding: 16px;
            border-radius: 18px;
            text-align: center;
        }

        .promo-msg {
            font-size: 12.5px;
            color: #cbd5e1;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .promo-cta {
            display: block;
            background: linear-gradient(135deg, #79b793, #4e8765);
            color: #0c1210;
            text-decoration: none;
            padding: 13px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 14.5px;
            box-shadow: 0 6px 20px rgba(121, 183, 147, 0.25);
            transition: 0.25s;
        }

        .promo-cta:hover {
            transform: translateY(-2px);
            filter: brightness(1.08);
        }

        .footer {
            margin-top: 22px;
            font-size: 11.5px;
            color: var(--text-muted);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 14px;
        }

        .footer span {
            color: var(--pao-accent);
            font-weight: 800;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- لوجو PÀO -->
        <div class="logo-box">
            <img src="https://images.unsplash.com/photo-1541167760496-1628856ab772?w=150" alt="Logo" class="logo">
        </div>
        
        <h1>PÀO</h1>
        <p>Boba & More • نسعد دائماً بخدمتك وتقييمك لنا</p>

        <!-- تقييم جوجل -->
        <a href="رابط_جوجل" class="link-btn btn-google" target="_blank">
            <span>⭐ قيّمنا بـ 5 نجوم على جوجل</span>
            <span>‹</span>
        </a>

        <!-- إنستاباي -->
        <a href="https://ipn.eg/" class="link-btn btn-instapay" target="_blank">
            <span>💳 الدفع الفوري عبر InstaPay</span>
            <span>‹</span>
        </a>

        <!-- المحافظ -->
        <div class="wallet-container">
            <button class="wallet-toggle" onclick="toggleWallets()">
                <span>📱 المحافظ الإلكترونية</span>
                <span id="arrowIcon">▾</span>
            </button>
            <div id="walletList" class="wallet-dropdown">
                <div class="wallet-row">
                    <div class="wallet-details">
                        <div class="w-title">فودافون كاش</div>
                        <div class="w-digits">01208884686</div>
                        <div class="w-owner">باسم: mohamed m** a** a</div>
                    </div>
                    <button class="copy-action" onclick="copyNum('01208884686')">نسخ</button>
                </div>
            </div>
        </div>

        <!-- السوشيال ميديا -->
        <div class="social-grid">
            <a href="رابط_فيس" class="social-chip s-fb" target="_blank">فيسبوك</a>
            <a href="رابط_انستا" class="social-chip s-ig" target="_blank">انستجرام</a>
            <a href="رابط_تيكتوك" class="social-chip s-tk" target="_blank">تيك توك</a>
            <a href="رابط_واتساب" class="social-chip s-wa" target="_blank">واتساب</a>
        </div>

        <!-- التسويق الذاتي -->
        <div class="promo-card">
            <div class="promo-msg">عجبك الستاند الذكي وحابب تعمل واحد لمشروعك؟ 🚀</div>
            <a href="https://wa.me/201208884686?text=مرحباً%20ماضو،%20أعجبني%20نظام%20Tapio%20وأريد%20عمل%20ستاند%20ذكي%20لمشروعي" class="promo-cta" target="_blank">
                ✨ احصل على ستاند ذكي لمشروعك الآن
            </a>
        </div>

        <div class="footer">
            Powered by <span>Tapio</span> 🚀
        </div>
    </div>

    <script>
        function toggleWallets() {
            const list = document.getElementById("walletList");
            const arrow = document.getElementById("arrowIcon");
            list.classList.toggle("active");
            arrow.style.transform = list.classList.contains("active") ? "rotate(180deg)" : "rotate(0deg)";
        }
        function copyNum(txt) {
            navigator.clipboard.writeText(txt);
            alert("تم نسخ الرقم بنجاح! 📋");
        }
    </script>

</body>
</html>
