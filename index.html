<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة الدفع والتقييم - Mado</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: #1e293b;
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            text-align: center;
            border: 1px solid #334155;
        }
        .logo {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 15px;
            border: 3px solid #38bdf8;
            background: #334155;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 5px;
            color: #f8fafc;
        }
        p {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            margin: 12px 0;
            border-radius: 12px;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            transition: 0.2s;
            box-sizing: border-box;
            cursor: pointer;
            border: none;
        }
        .btn-google {
            background-color: #f59e0b;
            color: #000;
        }
        .btn-instapay {
            background-color: #6366f1;
            color: #fff;
        }
        .wallet-card {
            background-color: #334155;
            border: 1px solid #475569;
            border-radius: 12px;
            padding: 12px;
            margin: 10px 0;
            text-align: center;
        }
        .wallet-title {
            font-size: 14px;
            color: #38bdf8;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .wallet-number {
            font-size: 17px;
            letter-spacing: 1px;
            background: #0f172a;
            color: #fff;
            padding: 8px;
            border-radius: 8px;
            display: block;
            cursor: pointer;
            border: 1px dashed #64748b;
        }
        .wallet-number:active {
            background: #1e293b;
        }
        .btn:active {
            transform: scale(0.98);
        }
        .footer {
            margin-top: 20px;
            font-size: 11px;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- لوجو Mado -->
        <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=150" alt="Mado Logo" class="logo">
        
        <h1>Mado</h1>
        <p>شكراً لزيارتك! يرجى اختيار الخدمة المطلوبة أدناه:</p>

        <!-- زرار تقييم جوجل المباشر -->
        <a href="https://search.google.com/local/writereview?placeid=ChIJfdYbWADf9RQR_HyAz1upcCo&utm_source=chatgpt.com&pli=1" class="btn btn-google" target="_blank">
            ⭐ قيّمنا بـ 5 نجوم على جوجل
        </a>

        <!-- زرار إنستاباي -->
        <a href="https://ipn.eg/S/mohamed.ahmed424161/instapay/3hr1LX" class="btn btn-instapay" target="_blank">
            💳 الدفع الفوري عبر InstaPay
        </a>

        <!-- قسم المحافظ المتعددة -->
        <div style="margin-top: 20px; text-align: right;">
            <div style="font-size: 13px; color: #94a3b8; margin-bottom: 5px; text-align: center;">📱 المحافظ الإلكترونية (اضغط على الرقم للنسخ):</div>

            <!-- المحفظة الأولى -->
            <div class="wallet-card">
                <div class="wallet-title">فودافون كاش (Vodafone Cash)</div>
                <div class="wallet-number" onclick="copyText('01208884686')">01208884686</div>
            </div>

            <!-- المحفظة الثانية (يمكنك تغيير الاسم ورقم الهاتف لأي شبكة أخرى) -->
            <div class="wallet-card">
                <div class="wallet-title">إنستاباي / محفظة أخرى (Etisalat/Orange)</div>
                <div class="wallet-number" onclick="copyText('01012345678')">01012345678</div>
            </div>
        </div>

        <div class="footer">
            Powered by ReviewPro Solutions 🚀
        </div>
    </div>

    <script>
        function copyText(text) {
            navigator.clipboard.writeText(text);
            alert("تم نسخ الرقم: " + text + " بنجاح! 📋");
        }
    </script>

</body>
</html>
