<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الدفع - Tapio</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 450px;
            margin: 40px auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        /* تصميم اللوجو */
        .logo {
            width: 100px;
            height: 100px;
            object-fit: contain;
            margin-bottom: 15px;
            border-radius: 50%;
        }
        h2 {
            color: #333;
            margin-bottom: 10px;
        }
        p {
            color: #666;
            margin-bottom: 25px;
            font-size: 14px;
        }
        /* الأزرار وروابط المنصات */
        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            transition: background 0.3s;
        }
        /* زر الدفع أو انستاباي */
        .btn-instapay {
            background-color: #5b2d82; /* لون قريب لهوية انستاباي */
            color: white;
        }
        .btn-instapay:hover {
            background-color: #482367;
        }
        /* زر تقييم جوجل */
        .btn-google {
            background-color: #4285F4;
            color: white;
        }
        .btn-google:hover {
            background-color: #3367d6;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 1. اللوجو (تأكد أن صورة اللوجو مرفوعة في نفس المستودع باسم logo.png أو غير اسمها هنا) -->
        <img src="logo.png" alt="شعار المتجر" class="logo" onerror="this.style.display='none'">
        
        <h2>بوابة الدفع والخدمات</h2>
        <p>اختر الطريقة المناسبة لإتمام الدفع أو التواصل معنا</p>
        
        <!-- 2. زر Instapay (استبدل yourname@instapay بعنوان حسابك الحقيقي) -->
        <a href="instapay://send?pa=yourname@instapay&am=&cu=EGP" class="btn btn-instapay">
            الدفع عبر انستاباي (InstaPay)
        </a>

        <!-- ملاحظة نصية عنوان انستاباي للاحتياط -->
        <p style="font-size: 12px; color: #888; margin-top: -5px; margin-bottom: 20px;">
            العنوان اللحظي: <strong>yourname@instapay</strong>
        </p>

        <!-- 3. زر تقييم جوجل (استبدل الرابط برابط مراجعات جوجل الخاص بنشاطك) -->
        <a href="https://maps.app.goo.gl/YOUR_GOOGLE_REVIEW_LINK" target="_blank" class="btn btn-google">
            قيّمنا على جوجل (Google Review)
        </a>
    </div>

</body>
</html>
